# Mise à jour automatique de la Randothèque, chaque jour, depuis le blog du club.
# Le site est publié sur GitHub Pages (Settings > Pages > Source : « GitHub Actions »).
name: Mise à jour quotidienne

on:
  schedule:
    # Objectif : 4h07 heure de Paris, toute l'année (pas à l'heure pile : c'est là que GitHub
    # retarde ou abandonne le plus ses tâches programmées). Créneaux UTC qui couvrent l'été
    # et l'hiver, plus des rattrapages : le job « heure » (scripts/should-sync.mjs) ne laisse
    # passer que le premier créneau après 4h à Paris si le blog n'a pas déjà été synchronisé.
    - cron: '7 2-5 * * *'
    - cron: '37 5,6 * * *'
  workflow_dispatch:        # bouton « Run workflow » pour lancer une mise à jour à la main
  push:
    branches: [main]

permissions:
  contents: write   # enregistrer les nouveaux GPX dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: randotheque
  cancel-in-progress: false

jobs:
  heure:
    runs-on: ubuntu-latest
    outputs:
      lancer: ${{ steps.verif.outputs.lancer }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/should-sync.mjs
            data/blog-catalog.json
          sparse-checkout-cone-mode: false
      - id: verif
        name: Faut-il synchroniser maintenant ?
        run: echo "lancer=$(node scripts/should-sync.mjs)" >> "$GITHUB_OUTPUT"

  mise-a-jour:
    needs: heure
    if: needs.heure.outputs.lancer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les nouvelles sorties du blog
        run: node scripts/scrape-blog.mjs

      - name: Générer les données du site
        run: node scripts/build.mjs

      - name: Enregistrer les nouveaux GPX dans le dépôt
        run: |
          git config user.name "Randothèque (mise à jour automatique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpx/blog data/blog-catalog.json .cache
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour depuis le blog du $(date +%d/%m/%Y)"
            # Si le dépôt a bougé entre-temps, on garde nos fichiers fraîchement générés
            # (« -X theirs » désigne, pendant un rebase, le commit qu'on rejoue : le nôtre).
            for essai in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Nouvel essai d'enregistrement ($essai)…"; sleep 5
            done
          fi

      - name: Préparer le site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
