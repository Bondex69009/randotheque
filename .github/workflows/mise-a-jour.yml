# Mise à jour automatique des deux Randothèques, toutes les heures :
#   - Les Godillots Ailés (dossier godillots-ailes/), depuis le blog du club ;
#   - Gérard & Martine (dossier gerard-martine/), depuis les deux blogs de Gé.
# Tout est envoyé par FTP chez o2switch, sur https://randotheque.anthony-bondon.fr/ :
#   /godillots-ailes/ et /gerard-martine/ (chacun avec son espace stats dans stats/),
#   /stats/ (moteur commun des statistiques), / (page d'accueil, robots.txt, .htaccess)
#
# Secrets du dépôt : FTP_HOST, FTP_USER, FTP_PASSWORD (compte FTP dont le répertoire est la racine
# du sous-domaine). Le mot de passe des espaces stats est réglé dans stats-serveur/config.php.
# GitHub Pages ne sert plus qu'à rediriger les anciennes adresses des Godillots (liens partagés, gadget du blog).
name: Mise à jour horaire

on:
  schedule:
    # Toutes les heures à hh:07 (pas à l'heure pile : c'est là que GitHub retarde ou abandonne
    # le plus ses tâches programmées). Un passage sauté est rattrapé par le suivant.
    - cron: '7 * * * *'
  workflow_dispatch:        # bouton « Run workflow » pour lancer une mise à jour à la main
  push:
    branches: [main]

permissions:
  contents: write   # enregistrer les nouveaux GPX dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: randotheque
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # le tout premier envoi FTP (environ 4 000 fichiers) est long ; ensuite seuls les changements partent
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------------- Les Godillots Ailés
      - name: "Godillots : nouveautés et modifications du blog"
        working-directory: godillots-ailes
        run: node scripts/scrape-blog.mjs

      - name: "Godillots : générer les données du site"
        working-directory: godillots-ailes
        run: node scripts/build.mjs

      - name: "Godillots : randos du blog Poulx (« Chercher aussi sur »)"
        working-directory: godillots-ailes
        run: node scripts/scrape-poulx.mjs
        continue-on-error: true

      - name: "Godillots : recos du blog « Reco » des GA (« Chercher aussi sur »)"
        working-directory: godillots-ailes
        run: node scripts/scrape-reco.mjs
        continue-on-error: true

      # ---------------------------------------------------------------- Gérard & Martine
      # Un souci sur les blogs de Gé ne doit pas bloquer la mise à jour des Godillots.
      - name: "Gérard & Martine : nouveautés des deux blogs"
        working-directory: gerard-martine
        run: node scripts/scrape-blog.mjs
        continue-on-error: true

      - name: "Gérard & Martine : générer les données du site"
        id: gm_build
        working-directory: gerard-martine
        run: node scripts/build.mjs
        continue-on-error: true

      - name: "Gérard & Martine : randos du blog Poulx (« Chercher aussi sur »)"
        working-directory: gerard-martine
        run: node scripts/scrape-poulx.mjs
        continue-on-error: true

      # ---------------------------------------------------------------- Dépôt
      - name: Enregistrer les nouveaux fichiers dans le dépôt
        run: |
          git config user.name "Randothèque (mise à jour automatique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in godillots-ailes gerard-martine; do
            git add -A $d/gpx/blog $d/audio $d/data/blog-catalog.json $d/.cache $d/externes 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour depuis les blogs du $(TZ=Europe/Paris date '+%d/%m/%Y à %Hh%M')"
            # Si le dépôt a bougé entre-temps, on garde nos fichiers fraîchement générés
            # (« -X theirs » désigne, pendant un rebase, le commit qu'on rejoue : le nôtre).
            for essai in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Nouvel essai d'enregistrement ($essai)…"; sleep 5
            done
          fi

      - name: "Godillots : liste des randos RandoGPS (« Chercher aussi sur »)"
        working-directory: godillots-ailes
        run: node scripts/scrape-randogps.mjs
        continue-on-error: true

      - name: "Gérard & Martine : liste des randos RandoGPS (« Chercher aussi sur »)"
        working-directory: gerard-martine
        run: node scripts/scrape-randogps.mjs
        continue-on-error: true

      - name: "Godillots : préparer le site"
        working-directory: godillots-ailes
        run: node scripts/build-site.mjs

      - name: "Gérard & Martine : préparer le site"
        id: gm_site
        if: steps.gm_build.outcome == 'success'
        working-directory: gerard-martine
        run: node scripts/build-site.mjs
        continue-on-error: true

      # ---------------------------------------------------------------- Envoi chez o2switch
      # Chaque envoi tient son inventaire (.ftp-deploy-sync-state.json) dans son dossier distant :
      # seuls les fichiers modifiés partent, et rien d'autre n'est jamais effacé.
      - name: "Envoyer : Godillots Ailés -> /godillots-ailes/"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 600000   # 10 min par opération (30 s par défaut : trop court pour les gros audios et GPX)
          local-dir: ./godillots-ailes/_site/
          server-dir: ./godillots-ailes/

      - name: "Envoyer : Gérard & Martine -> /gerard-martine/"
        if: steps.gm_site.outcome == 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 600000   # 10 min par opération (30 s par défaut : trop court pour les gros audios et GPX)
          local-dir: ./gerard-martine/_site/
          server-dir: ./gerard-martine/

      # Moteur des statistiques : jamais le dossier data/ (base des visites et bases des villes, créées
      # sur le serveur), ni admin/ (le tableau de bord part dans le dossier stats/ de chaque site).
      - name: "Envoyer : moteur des statistiques -> /stats/"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 600000   # 10 min par opération (30 s par défaut : trop court pour les gros audios et GPX)
          local-dir: ./stats-serveur/
          server-dir: ./stats/
          exclude: |
            **/.git*
            **/.git*/**
            data/**
            admin/**

      - name: "Envoyer : page d'accueil et réglages du sous-domaine -> /"
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 600000   # 10 min par opération (30 s par défaut : trop court pour les gros audios et GPX)
          local-dir: ./hebergement/racine/
          server-dir: ./
          state-name: .ftp-deploy-racine.json

      # ---------------------------------------------------------------- Anciennes adresses github.io
      # Garde-fou : on ne redirige GitHub Pages que si le nouveau site répond vraiment
      # (DNS, certificat HTTPS et fichiers en place). Sinon Pages garde la version précédente.
      - name: Vérifier que le nouveau site répond
        id: enligne
        run: |
          for p in "" godillots-ailes/ gerard-martine/ godillots-ailes/stats/ gerard-martine/stats/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://randotheque.anthony-bondon.fr/$p" || echo 000)
            echo "https://randotheque.anthony-bondon.fr/$p : $code"
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://randotheque.anthony-bondon.fr/godillots-ailes/" || echo 000)
          if [ "$code" = "200" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Le nouveau site ne répond pas encore ($code) : GitHub Pages n'est pas redirigé pour l'instant."; fi

      # Une page qui renvoie vers la même page sur le nouveau site (chemin, recherche et #rando=… conservés),
      # y compris dans l'iframe du compteur sur le blog. (Gérard & Martine : son ancien dépôt s'en charge.)
      - name: Préparer la redirection depuis GitHub Pages
        if: steps.enligne.outputs.ok == 'true'
        run: |
          mkdir -p _redirect
          cat > _redirect/index.html <<'EOF'
          <!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <title>La Randothèque a déménagé</title>
          <script>
            var base = 'https://randotheque.anthony-bondon.fr/godillots-ailes/';
            var rest = location.pathname.replace(/^\/[^\/]+\/?/, '');
            location.replace(base + rest + location.search + location.hash);
          </script>
          <meta http-equiv="refresh" content="0; url=https://randotheque.anthony-bondon.fr/godillots-ailes/"></head>
          <body><p>La Randothèque a déménagé : <a href="https://randotheque.anthony-bondon.fr/godillots-ailes/">https://randotheque.anthony-bondon.fr/godillots-ailes/</a></p></body></html>
          EOF
          for f in 404 compteur stats; do cp _redirect/index.html _redirect/$f.html; done
          touch _redirect/.nojekyll

      - uses: actions/configure-pages@v5
        if: steps.enligne.outputs.ok == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.enligne.outputs.ok == 'true'
        with:
          path: _redirect

      - name: Publier la redirection sur GitHub Pages
        if: steps.enligne.outputs.ok == 'true'
        id: deploiement
        uses: actions/deploy-pages@v4
