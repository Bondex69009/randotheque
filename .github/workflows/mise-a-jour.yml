# Mise à jour automatique de la Randothèque, chaque jour, depuis le blog du club.
# Le site est publié sur GitHub Pages (Settings > Pages > Source : « GitHub Actions »).
name: Mise à jour quotidienne

on:
  schedule:
    - cron: '30 4 * * *'   # tous les jours à 4h30 UTC (5h30 en hiver, 6h30 en été)
  workflow_dispatch:        # bouton « Run workflow » pour lancer une mise à jour à la main
  push:
    branches: [main]

permissions:
  contents: write   # enregistrer les nouveaux GPX dans le dépôt
  pages: write
  id-token: write

concurrency:
  group: randotheque
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les nouvelles sorties du blog
        run: node scripts/scrape-blog.mjs

      - name: Générer les données du site
        run: node scripts/build.mjs

      - name: Enregistrer les nouveaux GPX dans le dépôt
        run: |
          git config user.name "Randothèque (mise à jour automatique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpx/blog data/blog-catalog.json .cache
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour depuis le blog du $(date +%d/%m/%Y)"
            git pull --rebase --autostash
            git push
          fi

      - name: Préparer le site
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
