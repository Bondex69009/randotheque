<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relive 3D | Randothèques</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0f0a">
  <!-- Outil « Relive 3D » : importer un GPX, voir son survol 3D (le lecteur des Randothèques), obtenir le code
       <iframe> à coller sur un blog. Les survols sont enregistrés sur le serveur (api.php). -->
  <script>(function(){var d=document.documentElement,k='rt-theme',m=null,q=window.matchMedia&&matchMedia('(prefers-color-scheme: light)');try{m=localStorage.getItem(k)}catch(e){}
function a(){d.setAttribute('data-theme',m==='light'||m==='dark'?m:(q&&q.matches?'light':'dark'))}a();
window.rtTheme={get:function(){return m==='light'||m==='dark'?m:'auto'},set:function(v){m=v==='auto'?null:v;try{m?localStorage.setItem(k,m):localStorage.removeItem(k)}catch(e){}a();document.dispatchEvent(new Event('rt-theme'))}};
if(q&&q.addEventListener)q.addEventListener('change',function(){if(!m){a();document.dispatchEvent(new Event('rt-theme'))}})})();</script>
  <link rel="icon" href="../../godillots-ailes/assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../godillots-ailes/assets/style.css?v=43">
  <link rel="stylesheet" href="../../godillots-ailes/assets/outils.css?v=1">
  <style>
    body { min-height: 100vh; background: var(--c-bg); }
    .rl { width: 100%; max-width: 60rem; margin-inline: auto; padding: var(--space-6) var(--space-4) var(--space-16); display: grid; gap: var(--space-6); }
    .rl-top { display: flex; align-items: flex-start; gap: var(--space-3); flex-wrap: wrap; }
    .rl-top__title { flex: 1; min-width: 12rem; }
    .rl-top__actions { display: flex; align-items: center; gap: var(--space-2); }
    @media (max-width: 40rem) { .rl-top__actions { order: -1; width: 100%; justify-content: flex-end; } }
    .rl-eyebrow { margin: 0; font-size: var(--fs-xs); font-weight: var(--fw-bold); letter-spacing: 0.12em; text-transform: uppercase; color: var(--c-accent); }
    .rl-eyebrow a { color: inherit; text-decoration: none; }
    .rl-eyebrow a:hover, .rl-eyebrow a:focus-visible { text-decoration: underline; }
    .rl-top h1 { font-size: var(--fs-2xl); font-weight: var(--fw-black); }
    .rl-lead { margin: var(--space-1) 0 0; max-width: 65ch; color: var(--c-text-muted); }
    .rl-card { padding: var(--space-5); border-radius: var(--radius-lg); background: var(--c-surface); border: var(--border-w) solid var(--c-border); box-shadow: var(--shadow-card); display: grid; gap: var(--space-4); }
    .rl-card h2 { font-size: var(--fs-xl); font-weight: var(--fw-bold); }
    .rl-muted { margin: 0; color: var(--c-text-muted); font-size: var(--fs-sm); }
    .rl-err { margin: 0; min-height: 1.25em; color: var(--c-danger); font-size: var(--fs-sm); }
    .rl-err.is-info { color: var(--c-text-muted); }
    /* Zone de dépôt du GPX */
    .rl-drop { position: relative; display: grid; justify-items: center; gap: var(--space-2); padding: var(--space-8) var(--space-4); text-align: center;
      border: 2px dashed var(--c-border-strong); border-radius: var(--radius-lg); background: var(--c-surface-2); cursor: pointer;
      transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease); }
    .rl-drop:hover, .rl-drop.is-over { border-color: var(--c-accent); background: var(--c-accent-ghost); }
    .rl-drop:focus-within { outline: 2px solid var(--c-accent); outline-offset: 2px; }
    .rl-drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .rl-drop__icon { width: 2.5rem; height: 2.5rem; color: var(--c-accent); }
    .rl-drop strong { font-size: var(--fs-lg); }
    /* Formulaires */
    .rl-grid { display: grid; gap: var(--space-3) var(--space-4); grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    .rl-field { display: grid; gap: var(--space-1); min-width: 0; }
    .rl-field--wide { grid-column: 1 / -1; }
    .rl-field label, .rl-label { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--c-text-muted); }
    .rl input:not([type="file"]), .rl select, .rl-code {
      width: 100%; min-height: var(--tap); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
      border: var(--border-w) solid var(--c-border-strong); background: var(--c-bg-raised); color: var(--c-text); font: inherit;
    }
    .rl input:focus-visible, .rl select:focus-visible, .rl-code:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; border-color: var(--c-accent); }
    .rl input[aria-invalid="true"] { border-color: var(--c-danger); }
    .rl-code { font: var(--fs-xs) / 1.5 "IBM Plex Mono", ui-monospace, monospace; resize: vertical; }
    .rl-form__actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .rl-stats { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
    .rl-stats li { padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill); background: var(--c-surface-3); font-size: var(--fs-sm); font-weight: var(--fw-semibold); }
    .rl-file { margin: 0; font-size: var(--fs-sm); color: var(--c-text-faint); overflow-wrap: anywhere; }
    .rl-result { border-color: var(--c-accent-ring); }
    .btn .icon { width: var(--icon); height: var(--icon); flex: none; }
    .rl-toast { position: fixed; left: 50%; bottom: var(--space-6); transform: translateX(-50%); z-index: 50; max-width: min(90vw, 32rem);
      padding: var(--space-3) var(--space-5); border-radius: var(--radius-md); background: var(--c-surface-3); color: var(--c-text);
      border: var(--border-w) solid var(--c-accent-ring); box-shadow: var(--shadow-pop); font-size: var(--fs-sm); }
    .rl-toast.is-error { border-color: var(--c-danger); }
    [hidden] { display: none !important; }
    @media (max-width: 40rem) { .rl-item__actions .btn { flex: 1 1 auto; } }
  </style>
</head>
<body>
  <main class="rl">
    <header class="rl-top">
      <div class="rl-top__title">
        <p class="rl-eyebrow"><a href="../">Outils des Randothèques</a></p>
        <h1>Relive 3D</h1>
        <p class="rl-lead">Importez un GPX : son survol 3D animé, le même que sur la Randothèque, est prêt à être intégré sur un blog.</p>
      </div>
      <div class="rl-top__actions">
      <a class="btn btn--ghost btn--sm" href="../"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span class="btn__label">Tous les outils</span></a>
      <button type="button" class="theme-btn" id="theme-btn" aria-label="Changer de thème">
        <svg class="icon theme-btn__auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
        <svg class="icon theme-btn__light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon theme-btn__dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="currentColor"/></svg>
      </button>
      </div>
    </header>

    <div id="app" style="display: contents">
      <!-- 1. Import -->
      <section class="rl-card" aria-labelledby="import-title">
        <h2 id="import-title">Importer un GPX</h2>
        <label class="rl-drop" id="drop">
          <svg class="rl-drop__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <strong>Choisir un fichier GPX</strong>
          <span class="rl-muted">ou le glisser ici (15 Mo au plus)</span>
          <input type="file" id="file" accept=".gpx,application/gpx+xml" aria-describedby="drop-err">
        </label>
        <p class="rl-err" id="drop-err" role="alert"></p>

        <form id="draft-form" class="rl-grid" hidden novalidate>
          <div class="rl-field--wide rl-grid" style="gap: var(--space-2)">
            <p class="rl-file" id="draft-file"></p>
            <ul class="rl-stats" id="draft-stats"></ul>
          </div>
          <div class="rl-field rl-field--wide"><label for="f-name">Nom du survol</label><input id="f-name" required maxlength="120" autocomplete="off"></div>
          <div class="rl-field"><label for="f-commune">Commune (carte météo)</label><input id="f-commune" maxlength="120" autocomplete="off"></div>
          <div class="rl-field"><label for="f-place">Lieu sous le titre</label><input id="f-place" maxlength="160" autocomplete="off"></div>
          <div class="rl-field"><label for="f-date">Date de la rando (météo du jour)</label><input id="f-date" type="date"></div>
          <div class="rl-field"><label for="f-color">Couleur de la trace</label><select id="f-color"></select></div>
          <div class="rl-form__actions rl-field--wide">
            <button type="submit" class="btn btn--primary" id="draft-save"><span class="btn__label">Enregistrer et obtenir le code</span></button>
            <button type="button" class="btn btn--outline" id="draft-preview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5Z" fill="currentColor"/></svg><span class="btn__label">Aperçu du survol</span></button>
            <button type="button" class="btn btn--ghost" id="draft-cancel"><span class="btn__label">Annuler</span></button>
          </div>
        </form>
      </section>

      <!-- 2. Code du survol qui vient d'être enregistré -->
      <section class="rl-card rl-result" id="result" aria-labelledby="result-title" hidden>
        <h2 id="result-title">Survol enregistré : <span id="result-name"></span></h2>
        <label class="rl-label" for="result-code">Code à coller dans la vue HTML d'un message Blogger</label>
        <textarea class="rl-code" id="result-code" rows="4" readonly spellcheck="false"></textarea>
        <div class="rl-form__actions">
          <button type="button" class="btn btn--primary" id="result-copy"><span class="btn__label">Copier le code</span></button>
          <a class="btn btn--outline" id="result-open" href="#" target="_blank" rel="noopener"><span class="btn__label">Ouvrir la page à intégrer</span></a>
        </div>
      </section>
    </div>
  </main>
  <p class="rl-toast" id="toast" role="status" aria-live="polite" hidden></p>

  <script>

ck" d="M19.9 13.4L21.2 29.8"/></g></g></svg>';

  <script src="../../godillots-ailes/assets/theme.js?v=1"></script>
  <script src="assets/relive.js?v=2"></script>
  <!-- Habillage de fin d'année (25 nov. au 6 janv.) -->
  <script src="../../godillots-ailes/assets/noel.js?v=1" data-neige="10" data-bonnet="#theme-btn"></script>
</body>
</html>
