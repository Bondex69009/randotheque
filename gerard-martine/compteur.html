<head>

  <title>Compteur de Gérard &amp; Martine | La Randothèque</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Compteur total de Gérard & Martine, à intégrer sur un blog avec une balise <iframe> (voir le bouton « Intégrer » du site).
       ?theme=clair pour un fond clair. Les chiffres viennent de data/compteur.js, régénéré à chaque mise à jour. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap">
  <style>
    :root {
      --accent: #ffa45c; --accent-soft: #ffc796; --text: #eef2fb; --muted: #a6b0cd;
      --card: rgb(13 19 34 / 0.9); --border: rgb(255 164 92 / 0.55); --on-accent: #1d1206;
    }
    :root[data-theme="clair"] {
      --accent: #b4521a; --accent-soft: #8f3f12; --text: #1a2033; --muted: #5b6276;
      --card: #ffffff; --border: rgb(180 82 26 / 0.45); --on-accent: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 4px; }
    .counter {
      display: flex; align-items: center; gap: 12px; max-width: 412px; margin: 0 auto; padding: 14px 18px 14px 14px;
      border-radius: 18px; border: 1px solid var(--border); color: var(--text);
      background: linear-gradient(135deg, rgb(255 164 92 / 0.18), rgb(255 143 163 / 0.06) 55%, rgb(95 212 196 / 0.05)), var(--card);
    }
    .icon {
      flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px;
      background: var(--accent); color: var(--on-accent);
    }
    .icon svg { width: 40px; height: 40px; }
    .hiker { width: 2rem; height: 2rem; overflow: hidden; fill: currentColor; stroke: none; }
    .hiker g, .hiker path { transform-box: view-box; }
    .hiker__pack { opacity: 0.85; }
    .hiker__ground, .hiker__stick { fill: none; stroke: currentColor; stroke-linecap: round; }
    .hiker__stick { stroke-width: 1.1; }
    .hiker__ground { stroke-width: 1.2; stroke-dasharray: 2.5 2.5; opacity: 0.55; animation: hiker-ground 1.2s linear infinite; }
    .hiker__arm--b, .hiker__leg--b { opacity: 0.55; }
    .hiker__body { animation: hiker-bob 0.6s ease-in-out infinite alternate; }
    .hiker__leg { transform-origin: 15px 18px; animation: hiker-thigh 1.2s ease-in-out infinite; }
    .hiker__shin { transform-origin: 15px 23.4px; animation: hiker-knee 1.2s ease-in-out infinite; }
    .hiker__arm { transform-origin: 16.6px 11.2px; animation: hiker-arm 1.2s ease-in-out infinite; }
    .hiker__leg--b, .hiker__leg--b .hiker__shin, .hiker__arm--a { animation-delay: -0.6s; }
    @keyframes hiker-thigh { 0%, 100% { transform: rotate(-26deg); } 50% { transform: rotate(22deg); } }
    @keyframes hiker-knee { 0%, 100% { transform: rotate(4deg); } 40% { transform: rotate(8deg); } 62% { transform: rotate(58deg); } 85% { transform: rotate(18deg); } }
    @keyframes hiker-arm { 0%, 100% { transform: rotate(22deg); } 50% { transform: rotate(-20deg); } }
    @keyframes hiker-bob { from { transform: translateY(0.5px); } to { transform: translateY(-0.5px); } }
    @keyframes hiker-ground { to { stroke-dashoffset: 10; } }
    @media (prefers-reduced-motion: reduce) { .hiker *, .hiker { animation: none !important; } }
    .body { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
    .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .value { font-size: 34px; font-weight: 800; color: var(--accent); margin: 3px 0; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .value small { font-size: 15px; font-weight: 600; color: var(--muted); }
    .hint { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* Colonne latérale d'un blog (environ 200 à 340 px) : contenu empilé et centré, textes sur plusieurs lignes */
    /* Colonne latérale d'un blog (environ 200 à 340 px) : version compacte et centrée, avec un petit randonneur,
       qui tient dans 128 px de haut (même si la hauteur de l'iframe n'est pas ajustée par le blog) */
    @media (max-width: 340px) {
      body { padding: 2px; }
      .counter { flex-direction: column; text-align: center; gap: 0; padding: 10px 10px 11px; border-radius: 14px; }
      .icon { width: 26px; height: 26px; border-radius: 8px; margin-bottom: 4px; }
      .icon svg { width: 22px; height: 22px; }
      .body { align-items: center; }
      .label { letter-spacing: 0.04em; }
      .value { font-size: 32px; margin: 2px 0 1px; }
    }
    @media (max-width: 220px) {
      .value { font-size: 26px; }
      .label { font-size: 10px; letter-spacing: 0.02em; }
    }
  </style>
</head>
<body>
  <div class="counter" id="counter">
    <span class="icon" aria-hidden="true"><svg class="hiker" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="hiker__ground" d="M-6 30.8H38"/><g class="hiker__body"><g class="hiker__arm hiker__arm--b"><path d="M15.7 10.8C15.8 12.6 16.1 14.2 16.3 15.3L17.6 15.1C17.7 13.6 17.6 12.2 17.5 10.8Z"/><path d="M16.3 14.6C17.1 15.4 18 16 19.1 16.7L19.8 15.8C18.8 15.2 18.1 14.6 17.5 14.1Z"/><circle cx="19.6" cy="16.3" r=".85"/></g><g class="hiker__leg hiker__leg--b"><path d="M13.5 17.4C13.6 19.8 13.9 21.9 14.1 23.7H15.9C16.3 21.9 16.9 19.7 17 17.4Z"/><g class="hiker__shin"><path d="M14.1 23.2C13.6 24.6 13.9 26.9 14.3 28.6H15.7C15.9 26.9 16.2 24.9 15.9 23.2Z"/><path d="M14.2 28.1H15.8C16.7 28.4 17.9 28.7 18.2 29.4 18.3 29.9 18 30.1 17.5 30.1H14.3C13.9 30.1 13.9 29.3 14.2 28.1Z"/></g></g><path class="hiker__pack" d="M11.2 11.6C11.1 9.9 13.9 9.3 15.1 10.4L15.6 16.3C15.7 17.6 11.9 17.9 11.5 16.7Z"/><path d="M11.6 9.8C12.3 9 13.9 8.9 14.6 9.6L14.4 10.4C13.6 10 12.6 10.1 11.9 10.6Z"/><path d="M14.8 10C16.2 9.3 18.1 9.6 18.5 11.2 18.6 12.9 18 15.4 17.6 17.4 17.3 18.8 13.4 18.9 13.5 17.4 13.6 15 14 12.2 14.8 10Z"/><path d="M16.6 8.2L17.8 8.3 17.7 9.9 16.4 9.8Z"/><circle cx="17.9" cy="6.6" r="2"/><path d="M14.9 5.6C16.4 5.1 19.5 5 21.1 5.5 21.4 5.7 21.2 6 20.9 6 19.2 5.9 16.6 6 15 6.3 14.6 6.3 14.5 5.8 14.9 5.6ZM16.2 5.3C16.2 3.7 19.6 3.6 19.7 5.2Z"/><g class="hiker__leg hiker__leg--a"><path d="M13.5 17.4C13.6 19.8 13.9 21.9 14.1 23.7H15.9C16.3 21.9 16.9 19.7 17 17.4Z"/><g class="hiker__shin"><path d="M14.1 23.2C13.6 24.6 13.9 26.9 14.3 28.6H15.7C15.9 26.9 16.2 24.9 15.9 23.2Z"/><path d="M14.2 28.1H15.8C16.7 28.4 17.9 28.7 18.2 29.4 18.3 29.9 18 30.1 17.5 30.1H14.3C13.9 30.1 13.9 29.3 14.2 28.1Z"/></g></g><g class="hiker__arm hiker__arm--a"><path d="M15.7 10.8C15.8 12.6 16.1 14.2 16.3 15.3L17.6 15.1C17.7 13.6 17.6 12.2 17.5 10.8Z"/><path d="M16.3 14.6C17.1 15.4 18 16 19.1 16.7L19.8 15.8C18.8 15.2 18.1 14.6 17.5 14.1Z"/><circle cx="19.6" cy="16.3" r=".85"/><path class="hiker__stick" d="M19.9 13.4L21.2 29.8"/></g></g></svg></span>
    <span class="body">
      <span class="label" id="label">Les km de Gérard &amp; Martine</span>
      <span class="value"><span id="km" aria-hidden="true">…</span> <small>km</small><span id="km-sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></span></span>
      <span class="hint" id="as-of"></span>
    </span>
  </div>
  <script src="data/compteur.js"></script>
  <script>
    (() => {
      const theme = new URLSearchParams(location.search).get('theme');
      if (theme === 'clair') document.documentElement.dataset.theme = 'clair';
      const data = window.COMPTEUR;
      const el = document.getElementById('km');
      if (!data) { el.textContent = '–'; return; }
      const fmt = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format;
      document.getElementById('km-sr').textContent = `${fmt(data.km)} km`;
      // Kilométrage arrêté à la date de la dernière mise à jour (randos dont la date est passée)
      if (data.since) document.getElementById('label').textContent = `Gérard & Martine · depuis ${data.since}`;
      const asOf = data.asOf || (data.generatedAt || '').slice(0, 10);
      if (asOf) {
        document.getElementById('as-of').textContent = `au ${new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(`${asOf}T12:00:00`))}`;
      }
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      // Défilement du compteur quand il devient visible sur la page du blog
      const run = () => {
        if (reduced) { el.textContent = fmt(data.km); return; }
        const t0 = performance.now(), ms = 1800;
        const step = (t) => {
          const k = Math.min(1, (t - t0) / ms);
          el.textContent = fmt(Math.round(data.km * (1 - Math.pow(1 - k, 4))));
          if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      };
      // Hauteur envoyée à la page du blog : le code d'intégration ajuste l'iframe (rien n'est coupé)
      const postHeight = () => {
        if (window.parent === window) return;
        window.parent.postMessage({ gaCompteurHeight: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
      };
      if ('ResizeObserver' in window) new ResizeObserver(postHeight).observe(document.body);
      window.addEventListener('load', postHeight);
      postHeight();
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
          if (entries.some((e) => e.isIntersecting)) { io.disconnect(); run(); }
        });
        io.observe(el);
      } else run();
    })();
  </script>
  <script src="assets/stats.js?v=4" data-site="gm" data-widget defer></script>
